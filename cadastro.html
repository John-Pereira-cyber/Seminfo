<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Seminfo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <header>
        <b>Seminfo</b>
        <nav><a href="LOGIN"> Fazer Login </a></nav>
    </header>
    <main>
        <section>
           <form>
            <h2>Cadastrar no Sistema Seminfo</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="1">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <label for="perfil">Perfil:</label>
            <select name="perfil" id="perfil" required>
                <option value="" hidden>Selecione um perfil</option>
                <option value="aluno">Aluno Ouvinte</option>
                <option value="professor">Professor (Apresentador)</option>
                <option value="externo">Externo (Ouvinte ou Apresentador)</option>
            </select>
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" name="matricula" required>
            <label for="curso">Curso:</label>
            <select id="curso" required>
                <option value="" hidden>Selecione um curso</option>
                <option value="Sistemas de informação">Sistemas de informação</option>
                <option value="GTI">Gestão de TI</option>
                <option value="TI">TI</option>
                <option value="TADS">TADS</option>
            </select>
            <label for="instituição">Instituição</label>
            <input type="text" id="matricula" name="instiutição" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="msg" class="msg"></p>
        <p>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
        <script src="js/cadastro.js"></script>
    </main>
</body>
</html>
